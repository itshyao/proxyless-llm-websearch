
services:
  proxyless-llm-websearch-ag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxyless-llm-websearch-ag
    ports:
      - "8800:8800"
    restart: unless-stopped
    command: uvicorn agent/api_serve:app --host 0.0.0.0 --port 8800 --workers 1
    healthcheck:
      test: ["CMD-SHELL","curl --fail 'http://localhost:8800/healthy' || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
